<style>
:root{--olive:#696350;--sand:#b9b390;--gold:#b69148;--cream:#fefbf0;--char:#33373d;--ink:#333;--line:#e6e0cc}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--cream);color:var(--ink);font:15px/1.6 Cairo,Arial,sans-serif;display:flex;flex-direction:column}
header{background:#fefbf0;color:var(--olive);padding:12px max(3vw,14px);display:flex;align-items:center;gap:22px;flex-wrap:wrap;border-bottom:3px solid var(--sand)}
header img{width:clamp(96px,10vw,124px);height:auto;flex:none}
.sep{width:1px;align-self:stretch;background:var(--line)}
.ttl{flex:1 1 260px}
.brand{font-family:Italiana,serif;letter-spacing:.3em;font-size:12px;color:var(--sand);margin:0}
h1{font-family:Alexandria,Cairo,sans-serif;font-size:clamp(20px,2.6vw,28px);line-height:1.2;margin:0}
h1{color:#333}h1 b{color:var(--olive)}
.stats{display:flex;gap:22px}
.stats div{text-align:center}.stats strong{display:block;font-family:Alexandria;font-size:22px;color:var(--olive);line-height:1.1}.stats span{font-size:12px;color:#696350}
.main{flex:1;display:grid;grid-template-columns:330px minmax(0,1fr);min-height:0}
aside{background:#fff;border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px}
.chip{font:inherit;font-size:13px;min-height:34px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;border-radius:50%}
.chip[aria-pressed=true]{background:var(--olive);color:var(--cream);border-color:var(--olive)}
.search{margin:0 12px 8px;padding:9px 12px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--cream)}
ul{list-style:none;margin:0;padding:0 0 12px;overflow:auto;flex:1}
li{display:flex;gap:10px;align-items:center;padding:9px 12px;cursor:pointer;border-bottom:1px solid #f1ecdc}
li:hover,li.on{background:#faf3dc}
li .num{width:28px;height:28px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
li b{display:block;font-weight:600}li small{color:#696350}
.new{font-size:11px;background:var(--gold);color:#fff;border-radius:4px;padding:0 5px;margin-inline-start:4px}
#map{height:100%;min-height:420px;background:#2a2a24}
.pin{width:30px;height:30px;border-radius:50%;color:#fff;font:700 13px Cairo,sans-serif;display:grid;place-items:center;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.pin.hq{border-radius:7px;background:#33373d!important;border-color:var(--gold);border-width:3px}
.leaflet-tooltip.lbl{background:rgba(51,55,61,.88);color:#fff;border:0;font:600 12px Cairo,sans-serif;padding:2px 8px;box-shadow:none}
.leaflet-tooltip.lbl:before{display:none}
.leaflet-popup-content{font:14px/1.6 Cairo,sans-serif;direction:rtl;text-align:right;margin:12px 14px}
.leaflet-popup-content b{font-family:Alexandria;font-size:15px;display:block}
.leaflet-popup-content a.go{display:inline-block;margin-top:8px;background:var(--olive);color:#fff;padding:5px 12px;border-radius:8px;text-decoration:none}
.leaflet-popup-content .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.leaflet-popup-content .acts a.go{margin:0}
.leaflet-popup-content a.go.ap{background:#33373d}
.shr{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin-top:10px;font:600 14px Cairo,sans-serif;border:1px solid var(--gold);background:#fff;color:#7a5f22;border-radius:10px;padding:8px 12px;cursor:pointer;min-height:40px}
.shr:hover{background:#faf3dc}.shr.ok{background:var(--gold);color:#fff}
.cp{display:flex;gap:6px;margin-top:8px;align-items:center}
.cp input{font:600 13px Cairo,sans-serif;direction:ltr;width:170px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--cream);color:var(--ink)}
.cp button{font:600 13px Cairo,sans-serif;border:1px solid var(--gold);background:#fff;color:#7a5f22;border-radius:8px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.cp button.ok{background:var(--gold);color:#fff}
.leaflet-popup-content a.cta{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;background:#1f8f4e;color:#fff;font:700 14px Cairo,sans-serif;padding:9px 12px;border-radius:10px;text-decoration:none}
.leaflet-popup-content a.cta:hover{background:#18763f}
.leaflet-popup-content a.go.call{background:#33373d}
.leaflet-popup-content a.go.dir{background:var(--olive)}
.leaflet-popup-content .acts a.go{flex:1;text-align:center;white-space:nowrap;padding-inline:8px}
.leaflet-popup-content .links{margin-top:8px;font-size:13px;display:flex;gap:6px;justify-content:center}
.leaflet-popup-content .links a{color:#7a5f22}
.leaflet-popup-content .links span{color:#b9b390}
.hot{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--olive);border:1px solid var(--sand);border-radius:12px;padding:4px 14px;line-height:1.2}
.hot small{font-size:11px;color:#696350}.hot strong{font-family:Alexandria;font-size:20px}
.lyr{position:absolute;top:10px;right:10px;z-index:500;display:flex;background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.3);overflow:hidden}
.lyr button{font:600 13px Cairo,sans-serif;border:0;background:#fff;padding:8px 14px;cursor:pointer;color:var(--ink)}
.lyr button[aria-pressed=true]{background:var(--olive);color:#fff}
.wrapmap{position:relative;min-height:0}
@media(max-width:760px){html,body{height:auto}body{display:block}.main{display:flex;flex-direction:column}.wrapmap{order:-1;height:58vh}#map{min-height:0}aside{border:0}ul{overflow:visible}.stats{display:none}}
</style>
</head>

const am=p=>`https://maps.apple.com/?ll=${p.lat},${p.lng}&q=${encodeURIComponent(p.name)}`;
const counts={};D.forEach(p=>counts[p.area]=(counts[p.area]||0)+1);
document.getElementById('stats').innerHTML=[[D.length,'موقع'],[Object.keys(AREAS).length,'مناطق']].map(([v,l])=>`<div><strong>${v}</strong><span>${l}</span></div>`).join('');

const map=L.map('map',{zoomControl:true,maxZoom:19});
const esriAttr='Tiles &copy; Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community';
const sat=L.layerGroup([
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:esriAttr}),
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,opacity:.85}),
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19})
]).addTo(map);

const markers={};
D.forEach(p=>{
  const c=AREAS[p.area],hq=p.n===1;
  const icon=L.divIcon({className:'',html:`<div class="pin${hq?' hq':''}" style="background:${c}">${p.n}</div>`,iconSize:[30,30],iconAnchor:[15,15],popupAnchor:[0,-14]});
  const m=L.marker([p.lat,p.lng],{icon}).bindPopup(`<b>${p.name}</b>${p.area} · ${p.desc}<a class="cta wa" href="${wa(p)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2s.2-1.1.1-1.2l-.4-.2z"/></svg>استفسر عن المشروع على واتساب</a><div class="acts"><a class="go call" href="tel:19637">اتصل 19637</a><a class="go dir" href="${dir(p)}" target="_blank" rel="noopener">الاتجاهات للموقع</a></div><div class="links"><a href="${gm(p)}" target="_blank" rel="noopener">Google Maps</a><span>·</span><a href="${am(p)}" target="_blank" rel="noopener">Apple Maps</a></div><button type="button" class="shr" data-n="${p.n}"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg><span>مشاركة الموقع</span></button>`)
    .bindTooltip(p.name,{permanent:true,direction:'left',offset:[-16,0],className:'lbl'});
  m.on('click',()=>hilite(p.n,false));
  markers[p.n]=m;m.addTo(map);
});
const labels=()=>{const show=map.getZoom()>=16;D.forEach(p=>{const t=markers[p.n].getTooltip();if(t)t.setOpacity(show&&visible(p)?1:0)})};
map.on('zoomend',labels);

let sel='الكل',hl=null;
const visible=p=>sel==='الكل'||p.area===sel;
const chips=document.getElementById('chips');
chips.innerHTML=[`<button class="chip" data-a="الكل" aria-pressed="true">الكل (${D.length})</button>`].concat(Object.keys(AREAS).map(a=>`<button class="chip" data-a="${a}" aria-pressed="false"><i style="background:${AREAS[a]}"></i>${a} (${counts[a]})</button>`)).join('');
chips.addEventListener('click',e=>{const b=e.target.closest('.chip');if(b)setArea(b.dataset.a)});
function setArea(a){sel=a;chips.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.a===a));
  D.forEach(p=>{const m=markers[p.n];if(visible(p))m.addTo(map);else map.removeLayer(m)});
  fit();render();labels();}
function fit(){const pts=D.filter(visible).map(p=>[p.lat,p.lng]);if(pts.length===1)map.setView(pts[0],17);else map.fitBounds(pts,{padding:[50,50],maxZoom:17})}
const list=document.getElementById('list'),q=document.getElementById('q');
function render(){const t=q.value.trim();list.innerHTML=D.filter(p=>visible(p)&&(!t||p.name.includes(t))).map(p=>`<li data-n="${p.n}" class="${hl===p.n?'on':''}" tabindex="0"><span class="num" style="background:${p.n===1?'#33373d':AREAS[p.area]}">${p.n}</span><span><b>${p.name}</b><small>${p.area} · ${p.desc}</small></span></li>`).join('')}
function hilite(n,fly){hl=n;render();const p=D[n-1];track('فتح مشروع',p.name);if(fly){if(innerWidth<=760)document.querySelector('.wrapmap').scrollIntoView({behavior:'smooth',block:'start'});map.flyTo([p.lat,p.lng],18,{duration:.8});map.once('moveend',()=>markers[n].openPopup())}}
list.addEventListener('click',e=>{const li=e.target.closest('li');if(li)hilite(+li.dataset.n,true)});
list.addEventListener('keydown',e=>{if(e.key==='Enter'){const li=e.target.closest('li');if(li)hilite(+li.dataset.n,true)}});
q.addEventListener('input',render);
document.addEventListener('click',async e=>{const b=e.target.closest('.shr');if(!b)return;const p=D[+b.dataset.n-1],url=gm(p),lbl=b.querySelector('span');
  const done=t=>{lbl.textContent=t;b.classList.add('ok');setTimeout(()=>{lbl.textContent='مشاركة الموقع';b.classList.remove('ok')},2200)};
  if(navigator.share&&matchMedia('(pointer:coarse)').matches){try{await navigator.share({title:p.name,text:`${p.name} – مكي للتطوير العقاري`,url});return}catch(err){if(err&&err.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(`${p.name}\n${url}`);done('تم نسخ الرابط ✓')}catch(_){
    const t=document.createElement('textarea');t.value=`${p.name}\n${url}`;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}t.remove();done(ok?'تم نسخ الرابط ✓':'تعذّر النسخ')}});

function track(kind,name){try{if(window.goatcounter&&goatcounter.count)goatcounter.count({path:kind+' – '+name,title:kind,event:true})}catch(_){}}
document.addEventListener('click',e=>{const a=e.target.closest('a.cta.wa,a.go.call,a.go.dir,.leaflet-popup-content .links a,.shr,a.hot');if(!a)return;
  if(a.matches('a.hot')){track('اتصال','الترويسة');return}
  const box=a.closest('.leaflet-popup-content'),name=box?box.querySelector('b').textContent:'';
  const kind=a.matches('.wa')?'واتساب':a.matches('.call')?'اتصال':a.matches('.dir')?'اتجاهات':a.matches('.shr')?'مشاركة':/apple/i.test(a.href)?'Apple Maps':'Google Maps';
  track(kind,name)},true);
fit();render();labels();
})();
</script>
<script data-goatcounter="https://mekkymap.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
